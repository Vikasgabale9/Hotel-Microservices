spring:
  application:
    name: HotelService


  datasource:
      url: ${DB_URL:jdbc:mysql://localhost:3306/microservices}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  config:
    import: optional:configserver:http://localhost:8085

server:
  port: 8082