server:
  port: 8082

spring:
  application:
    name: HotelService

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/microservices}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  config:
    import: "configserver:http://localhost:8085"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      access: unrestricted
      show-details: always
    info:
      access: unrestricted

info:
  app:
    name: Hotel Service
    description: Hotel management microservice
    version: 1.0.0
