  spring:
    application:
      name: UserService


    datasource:
        url: ${DB_URL:jdbc:mysql://localhost:3306/microservices}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true

    config:
      import: configserver:http://localhost:8085

  server:
    port: 8081

  management:
    health:
      circuitbreakers:
        enabled: true
    endpoints:
      web:
        exposure:
          include: health
    endpoint:
      health:
        show-details: always

  resilience4j:
    circuitbreaker:
      instances:
        # Circuit breaker for getAllUsers()
        ratingHotelBreaker:
          registerHealthIndicator: true
          eventConsumerBufferSize: 10
          failureRateThreshold: 50
          minimumNumberOfCalls: 5
          automaticTransitionFromOpenToHalfOpenEnabled: true
          waitDurationInOpenState: 6s
          permittedNumberOfCallsInHalfOpenState: 3
          slidingWindowSize: 10
          slidingWindowType: COUNT_BASED

        # Circuit breaker for getUser(userId)
        userByIdBreaker:
          registerHealthIndicator: true
          eventConsumerBufferSize: 10
          failureRateThreshold: 50
          minimumNumberOfCalls: 5
          automaticTransitionFromOpenToHalfOpenEnabled: true
          waitDurationInOpenState: 6s
          permittedNumberOfCallsInHalfOpenState: 3
          slidingWindowSize: 10
          slidingWindowType: COUNT_BASED

    retry:
      instances:
        # Retry for getAllUsers()
        ratingHotelService:
          max-attempts: 3
          wait-duration: 5s

        # Retry for getUser(userId)
        userByIdRetry:
          max-attempts: 3
          wait-duration: 5s

    ratelimiter:
      instances:
        # Rate limiter for getAllUsers()
        userRateLimiter:
          limit-for-period: 5
          limit-refresh-period: 10s
          timeout-duration: 2s

        # Rate limiter for getUser(userId)
        userByIdRateLimiter:
          limit-for-period: 5
          limit-refresh-period: 10s
          timeout-duration: 0s